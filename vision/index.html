<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vision 实时识别</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #07090b;
      --panel: #11161b;
      --panel-2: #171d23;
      --line: #2a323a;
      --text: #eef2f5;
      --muted: #98a4ae;
      --green: #34d399;
      --cyan: #38bdf8;
      --amber: #fbbf24;
      --red: #f87171;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--text); }
    body {
      font-family: Inter, "Noto Sans SC", "Microsoft YaHei", sans-serif;
      letter-spacing: 0;
      overflow: hidden;
    }
    button, input { font: inherit; }
    .app {
      height: 100vh;
      display: grid;
      grid-template-rows: 58px minmax(0, 1fr);
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      padding: 0 22px;
      border-bottom: 1px solid var(--line);
      background: #0d1115;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }
    .mark {
      width: 29px;
      height: 29px;
      display: grid;
      place-items: center;
      border: 2px solid var(--cyan);
      color: var(--cyan);
      font-weight: 800;
      font-size: 12px;
    }
    h1 { margin: 0; font-size: 17px; font-weight: 700; }
    .model-name {
      color: var(--muted);
      font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
      font-size: 12px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .live-state {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: 13px;
      white-space: nowrap;
    }
    .dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--amber);
      box-shadow: 0 0 0 3px rgba(251, 191, 36, 0.12);
    }
    .dot.ready {
      background: var(--green);
      box-shadow: 0 0 0 3px rgba(52, 211, 153, 0.13);
    }
    .dot.error {
      background: var(--red);
      box-shadow: 0 0 0 3px rgba(248, 113, 113, 0.13);
    }
    .workspace {
      min-height: 0;
      display: grid;
      grid-template-columns: 292px minmax(0, 1fr);
    }
    aside {
      min-height: 0;
      overflow-y: auto;
      padding: 20px;
      border-right: 1px solid var(--line);
      background: var(--panel);
    }
    .section + .section {
      margin-top: 24px;
      padding-top: 22px;
      border-top: 1px solid var(--line);
    }
    .section-title {
      margin: 0 0 13px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
    }
    .metrics {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1px;
      background: var(--line);
      border: 1px solid var(--line);
    }
    .metric {
      min-width: 0;
      min-height: 72px;
      padding: 12px;
      background: var(--panel-2);
    }
    .metric strong {
      display: block;
      font-size: 21px;
      line-height: 1.15;
      color: var(--text);
      overflow-wrap: anywhere;
    }
    .metric span {
      display: block;
      margin-top: 7px;
      color: var(--muted);
      font-size: 11px;
    }
    .field { margin-top: 17px; }
    .field-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px;
      font-size: 13px;
    }
    .field-row output {
      color: var(--cyan);
      font-variant-numeric: tabular-nums;
    }
    input[type="range"] {
      width: 100%;
      accent-color: var(--cyan);
    }
    .toggle {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      cursor: pointer;
      font-size: 13px;
    }
    .toggle input { width: 18px; height: 18px; accent-color: var(--green); }
    .class-list {
      min-height: 36px;
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
    }
    .class-item {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 6px 8px;
      border: 1px solid var(--line);
      background: var(--panel-2);
      font-size: 12px;
    }
    .class-item b { color: var(--amber); }
    .target {
      display: grid;
      gap: 8px;
      color: var(--muted);
      font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
      font-size: 12px;
      line-height: 1.45;
    }
    .target strong { color: var(--text); font-family: inherit; }
    .empty { color: var(--muted); font-size: 12px; }
    .actions { display: grid; gap: 9px; }
    .button {
      min-height: 39px;
      border: 1px solid var(--line);
      border-radius: 4px;
      background: #20272e;
      color: var(--text);
      cursor: pointer;
      text-align: center;
      text-decoration: none;
      display: grid;
      place-items: center;
    }
    .button:hover { border-color: var(--cyan); }
    main {
      min-width: 0;
      min-height: 0;
      display: grid;
      grid-template-rows: minmax(0, 1fr) 38px;
      background: #050607;
    }
    .video-stage {
      min-width: 0;
      min-height: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
      position: relative;
    }
    #stream {
      display: block;
      width: auto;
      height: auto;
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      background: #050607;
    }
    #overlay {
      position: absolute;
      pointer-events: none;
    }
    .error-banner {
      position: absolute;
      left: 18px;
      right: 18px;
      bottom: 18px;
      padding: 11px 13px;
      border-left: 3px solid var(--red);
      background: rgba(42, 15, 17, 0.94);
      color: #fecaca;
      font-size: 13px;
      display: none;
    }
    footer {
      display: flex;
      align-items: center;
      gap: 18px;
      padding: 0 14px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      background: #0d1115;
      font-size: 11px;
      white-space: nowrap;
      overflow: hidden;
    }
    footer span { overflow: hidden; text-overflow: ellipsis; }
    @media (max-width: 820px) {
      body { overflow: auto; }
      .app { height: auto; min-height: 100vh; grid-template-rows: 58px auto; }
      .workspace { grid-template-columns: 1fr; }
      aside { border-right: 0; border-bottom: 1px solid var(--line); }
      main { min-height: 58vh; }
      .video-stage { min-height: 52vh; }
      .model-name { display: none; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div class="brand">
        <div class="mark">VIS</div>
        <div>
          <h1>视觉识别</h1>
          <div id="modelName" class="model-name">exp.pt</div>
        </div>
      </div>
      <div class="live-state">
        <span id="stateDot" class="dot"></span>
        <span id="stateText">正在连接</span>
      </div>
    </header>

    <div class="workspace">
      <aside>
        <section class="section">
          <h2 class="section-title">实时指标</h2>
          <div class="metrics">
            <div class="metric"><strong id="fps">0.0</strong><span>预览 FPS</span></div>
            <div class="metric"><strong id="inference">0.00</strong><span>推理 ms</span></div>
            <div class="metric"><strong id="detections">0</strong><span>当前目标</span></div>
            <div class="metric"><strong id="uptime">00:00</strong><span>运行时间</span></div>
          </div>
        </section>

        <section class="section">
          <h2 class="section-title">检测类别</h2>
          <div id="classList" class="class-list">
            <span class="empty">当前无目标</span>
          </div>
        </section>

        <section class="section">
          <h2 class="section-title">视觉坐标</h2>
          <div id="targetInfo" class="target">
            <span class="empty">还没有有效深度目标</span>
          </div>
        </section>

        <section class="section">
          <h2 class="section-title">识别设置</h2>
          <div class="field">
            <div class="field-row">
              <label for="confidence">置信度阈值</label>
              <output id="confidenceValue">50%</output>
            </div>
            <input id="confidence" type="range" min="5" max="95" value="50" step="1">
          </div>
          <div class="field">
            <label class="toggle">
              <span>显示类别与置信度</span>
              <input id="showLabels" type="checkbox" checked>
            </label>
          </div>
        </section>

        <section class="section actions">
          <a class="button" href="/snapshot.jpg" download="vision-detection.jpg">保存当前帧</a>
          <button id="pauseButton" class="button" type="button">暂停画面</button>
        </section>
      </aside>

      <main>
        <div class="video-stage">
          <img id="stream" src="/stream.mjpg" alt="视觉实时识别画面">
          <canvas id="overlay" aria-hidden="true"></canvas>
          <div id="errorBanner" class="error-banner"></div>
        </div>
        <footer>
          <span id="cameraInfo">摄像头 --</span>
          <span id="resolutionInfo">分辨率 --</span>
          <span id="timingInfo">总帧 --</span>
        </footer>
      </main>
    </div>
  </div>

  <script>
    const elements = {
      stateDot: document.getElementById("stateDot"),
      stateText: document.getElementById("stateText"),
      modelName: document.getElementById("modelName"),
      fps: document.getElementById("fps"),
      inference: document.getElementById("inference"),
      detections: document.getElementById("detections"),
      uptime: document.getElementById("uptime"),
      classList: document.getElementById("classList"),
      targetInfo: document.getElementById("targetInfo"),
      confidence: document.getElementById("confidence"),
      confidenceValue: document.getElementById("confidenceValue"),
      showLabels: document.getElementById("showLabels"),
      pauseButton: document.getElementById("pauseButton"),
      stream: document.getElementById("stream"),
      overlay: document.getElementById("overlay"),
      errorBanner: document.getElementById("errorBanner"),
      cameraInfo: document.getElementById("cameraInfo"),
      resolutionInfo: document.getElementById("resolutionInfo"),
      timingInfo: document.getElementById("timingInfo")
    };

    let paused = false;
    let updateTimer = null;
    let latestStatus = null;

    function formatUptime(seconds) {
      const hours = Math.floor(seconds / 3600);
      const minutes = Math.floor((seconds % 3600) / 60);
      const secs = seconds % 60;
      return hours > 0
        ? `${String(hours).padStart(2, "0")}:${String(minutes).padStart(2, "0")}`
        : `${String(minutes).padStart(2, "0")}:${String(secs).padStart(2, "0")}`;
    }

    function formatVector(values) {
      return values.map((value) => Number(value).toFixed(3)).join(", ");
    }

    function renderClasses(counts) {
      const entries = Object.entries(counts || {});
      elements.classList.replaceChildren();
      if (!entries.length) {
        const empty = document.createElement("span");
        empty.className = "empty";
        empty.textContent = "当前无目标";
        elements.classList.append(empty);
        return;
      }
      for (const [name, count] of entries) {
        const item = document.createElement("span");
        item.className = "class-item";
        const label = document.createElement("span");
        label.textContent = name;
        const value = document.createElement("b");
        value.textContent = count;
        item.append(label, value);
        elements.classList.append(item);
      }
    }

    function renderTarget(target) {
      elements.targetInfo.replaceChildren();
      if (!target) {
        const empty = document.createElement("span");
        empty.className = "empty";
        empty.textContent = "还没有有效深度目标";
        elements.targetInfo.append(empty);
        return;
      }
      const camera = document.createElement("div");
      camera.innerHTML = `<strong>camera</strong> ${formatVector(target.camera_xyz_m)} m`;
      const urdf = document.createElement("div");
      urdf.innerHTML = `<strong>urdf</strong> ${formatVector(target.urdf_xyz_m)} m`;
      elements.targetInfo.append(camera, urdf);
    }

    function streamRenderBox() {
      const stage = elements.stream.parentElement.getBoundingClientRect();
      const image = elements.stream.getBoundingClientRect();
      return {
        left: image.left - stage.left,
        top: image.top - stage.top,
        width: image.width,
        height: image.height
      };
    }

    function fitOverlayCanvas() {
      const box = streamRenderBox();
      const ratio = window.devicePixelRatio || 1;
      const width = Math.max(1, Math.round(box.width));
      const height = Math.max(1, Math.round(box.height));
      elements.overlay.style.left = `${box.left}px`;
      elements.overlay.style.top = `${box.top}px`;
      elements.overlay.style.width = `${width}px`;
      elements.overlay.style.height = `${height}px`;
      if (elements.overlay.width !== Math.round(width * ratio) ||
          elements.overlay.height !== Math.round(height * ratio)) {
        elements.overlay.width = Math.round(width * ratio);
        elements.overlay.height = Math.round(height * ratio);
      }
      const ctx = elements.overlay.getContext("2d");
      ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
      return { ctx, width, height };
    }

    function drawArrow(ctx, x, y, dx, dy, length, color, label) {
      const magnitude = Math.hypot(dx, dy) || 1;
      const ux = dx / magnitude;
      const uy = dy / magnitude;
      const endX = x + ux * length;
      const endY = y + uy * length;
      ctx.strokeStyle = color;
      ctx.fillStyle = color;
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(x, y);
      ctx.lineTo(endX, endY);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(endX, endY);
      ctx.lineTo(endX - ux * 14 - uy * 7, endY - uy * 14 + ux * 7);
      ctx.lineTo(endX - ux * 14 + uy * 7, endY - uy * 14 - ux * 7);
      ctx.closePath();
      ctx.fill();
      if (label) {
        ctx.font = "12px ui-monospace, SFMono-Regular, Consolas, monospace";
        ctx.fillText(label, endX + 7, endY - 7);
      }
    }

    function drawOverlay(data) {
      const { ctx, width, height } = fitOverlayCanvas();
      ctx.clearRect(0, 0, width, height);
      if (!data || !width || !height) return;

      const [streamWidth, streamHeight] = String(data.stream_resolution || data.resolution || "")
        .split("x")
        .map((value) => Number(value));
      if (!streamWidth || !streamHeight) return;
      const sx = width / streamWidth;
      const sy = height / streamHeight;

      ctx.save();
      ctx.globalAlpha = 0.94;
      drawArrow(ctx, 30, height - 34, 1, 0, 64, "#38bdf8", "x");
      drawArrow(ctx, 30, height - 34, 0, -1, 64, "#34d399", "y");

      const target = data.preview_detections?.[0] || null;
      if (target?.bbox_xyxy) {
        const [x1, y1, x2, y2] = target.bbox_xyxy.map(Number);
        const cx = ((x1 + x2) / 2) * sx;
        const cy = ((y1 + y2) / 2) * sy;
        const boxWidth = Math.abs(x2 - x1) * sx;
        const boxHeight = Math.abs(y2 - y1) * sy;
        const openHorizontal = boxWidth >= boxHeight;
        const openDx = openHorizontal ? 1 : 0;
        const openDy = openHorizontal ? 0 : 1;
        const approachDx = -openDy;
        const approachDy = openDx;
        const radius = Math.max(18, Math.min(42, Math.max(boxWidth, boxHeight) * 0.18));

        ctx.strokeStyle = "rgba(251, 191, 36, 0.92)";
        ctx.fillStyle = "rgba(251, 191, 36, 0.12)";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(cx, cy, radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        ctx.strokeStyle = "#fbbf24";
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(cx - openDx * radius - openDy * radius * 0.38, cy - openDy * radius + openDx * radius * 0.38);
        ctx.lineTo(cx - openDx * radius + openDy * radius * 0.38, cy - openDy * radius - openDx * radius * 0.38);
        ctx.moveTo(cx + openDx * radius - openDy * radius * 0.38, cy + openDy * radius + openDx * radius * 0.38);
        ctx.lineTo(cx + openDx * radius + openDy * radius * 0.38, cy + openDy * radius - openDx * radius * 0.38);
        ctx.stroke();

        drawArrow(ctx, cx, cy, approachDx, approachDy, radius * 1.8, "#f87171", "approach");
        drawArrow(ctx, cx, cy, openDx, openDy, radius * 1.45, "#fbbf24", "grip");

        ctx.fillStyle = "#eef2f5";
        ctx.font = "12px ui-monospace, SFMono-Regular, Consolas, monospace";
        ctx.fillText("夹爪目标朝向", cx + 10, cy + radius + 18);
      }
      ctx.restore();
    }

    async function refreshStatus() {
      try {
        const response = await fetch("/api/status", { cache: "no-store" });
        const data = await response.json();
        elements.modelName.textContent = data.model;
        elements.fps.textContent = Number(data.stream_fps).toFixed(1);
        elements.inference.textContent = Number(data.inference_ms).toFixed(2);
        elements.detections.textContent = data.detections;
        elements.uptime.textContent = formatUptime(data.uptime_seconds);
        elements.cameraInfo.textContent = `摄像头 ${data.camera}`;
        elements.resolutionInfo.textContent =
          `采集 ${data.resolution} / 推流 ${data.stream_resolution || data.resolution}`;
        elements.timingInfo.textContent =
          `总帧 ${Number(data.frame_ms || 0).toFixed(2)} ms / ${Number(data.jpeg_kb || 0).toFixed(1)} KB`;
        renderClasses(data.class_counts);
        renderTarget(data.latest_target);
        latestStatus = data;
        drawOverlay(data);

        if (document.activeElement !== elements.confidence) {
          const value = Math.round(Number(data.confidence) * 100);
          elements.confidence.value = value;
          elements.confidenceValue.textContent = `${value}%`;
        }
        elements.showLabels.checked = Boolean(data.show_labels);

        elements.stateDot.className = data.ready ? "dot ready" : data.error ? "dot error" : "dot";
        elements.stateText.textContent = data.ready ? "实时运行" : data.error ? "运行异常" : "正在启动";
        elements.errorBanner.style.display = data.error ? "block" : "none";
        elements.errorBanner.textContent = data.error || "";
      } catch (error) {
        elements.stateDot.className = "dot error";
        elements.stateText.textContent = "连接断开";
        drawOverlay(null);
      }
    }

    async function updateConfig(payload) {
      await fetch("/api/config", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });
    }

    elements.confidence.addEventListener("input", () => {
      elements.confidenceValue.textContent = `${elements.confidence.value}%`;
      clearTimeout(updateTimer);
      updateTimer = setTimeout(() => {
        updateConfig({ confidence: Number(elements.confidence.value) / 100 });
      }, 140);
    });

    elements.showLabels.addEventListener("change", () => {
      updateConfig({ show_labels: elements.showLabels.checked });
    });

    elements.pauseButton.addEventListener("click", () => {
      paused = !paused;
      if (paused) {
        elements.stream.removeAttribute("src");
        elements.pauseButton.textContent = "继续画面";
      } else {
        elements.stream.src = `/stream.mjpg?t=${Date.now()}`;
        elements.pauseButton.textContent = "暂停画面";
      }
    });

    window.addEventListener("resize", () => drawOverlay(latestStatus));
    elements.stream.addEventListener("load", () => drawOverlay(latestStatus));

    refreshStatus();
    setInterval(refreshStatus, 1000);
  </script>
</body>
</html>
